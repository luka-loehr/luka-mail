name: LukaMail
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

targets:
  LukaMail:
    type: application
    platform: iOS
    sources:
      - path: LukaMail
        excludes:
          - Info.plist
    resources:
      - path: LukaMail/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: LukaMail
        PRODUCT_BUNDLE_IDENTIFIER: $(LMAIL_BUNDLE_IDENTIFIER)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_MODULE_NAME: LukaMail
        CODE_SIGN_ENTITLEMENTS: LukaMail/LukaMail.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/LukaMail-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: $(LMAIL_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        SUPPORTS_MACCATALYST: NO
    preBuildScripts:
      - name: Generate build metadata
        script: |
          commit_sha="$(git -C "$SRCROOT/.." rev-parse --short=12 HEAD 2>/dev/null || true)"
          if [ -z "$commit_sha" ]; then commit_sha="Unknown"; fi
          cp "$SRCROOT/LukaMail/Info.plist" "$SCRIPT_OUTPUT_FILE_0"
          /usr/libexec/PlistBuddy -c "Set :GitCommitSHA $commit_sha" "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(SRCROOT)/LukaMail/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/LukaMail-Info.plist
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - LukaMailTests

  LukaMailTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LukaMailTests
    dependencies:
      - target: LukaMail
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LMAIL_BUNDLE_IDENTIFIER).tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        GENERATE_INFOPLIST_FILE: YES

  LukaMailMac:
    type: application
    platform: macOS
    sources:
      - path: LukaMail/Models
      - path: LukaMail/Services
      - path: LukaMail/Stores
      - path: LukaMail/Shared
      - path: LukaMail/AppIcon.icon
      - path: LukaMailMac
        excludes:
          - Info.plist
    resources:
      - path: LukaMailMac/Assets.xcassets
    settings:
      base:
        PRODUCT_NAME: LukaMailMac
        PRODUCT_BUNDLE_IDENTIFIER: $(LMAIL_BUNDLE_IDENTIFIER)
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: 6.0
        SWIFT_STRICT_CONCURRENCY: complete
        PRODUCT_MODULE_NAME: LukaMail
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: $(DERIVED_FILE_DIR)/LukaMailMac-Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: $(LMAIL_DISPLAY_NAME)
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: YES
        ENABLE_USER_SELECTED_FILES: readonly
        CODE_SIGN_ENTITLEMENTS: LukaMailMac/LukaMailMac.entitlements
    preBuildScripts:
      - name: Generate build metadata
        script: |
          commit_sha="$(git -C "$SRCROOT/.." rev-parse --short=12 HEAD 2>/dev/null || true)"
          if [ -z "$commit_sha" ]; then commit_sha="Unknown"; fi
          cp "$SRCROOT/LukaMailMac/Info.plist" "$SCRIPT_OUTPUT_FILE_0"
          /usr/libexec/PlistBuddy -c "Set :GitCommitSHA $commit_sha" "$SCRIPT_OUTPUT_FILE_0"
        inputFiles:
          - $(SRCROOT)/LukaMailMac/Info.plist
        outputFiles:
          - $(DERIVED_FILE_DIR)/LukaMailMac-Info.plist
        basedOnDependencyAnalysis: false
    scheme:
      testTargets:
        - LukaMailMacTests

  LukaMailMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: LukaMailTests
    dependencies:
      - target: LukaMailMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(LMAIL_BUNDLE_IDENTIFIER).mac-tests
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: 6.0
        PRODUCT_MODULE_NAME: LukaMailMacTests
        GENERATE_INFOPLIST_FILE: YES
